[package]
name = "asetea"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", features = ["persistence"] }
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg", "bmp"] }
rfd = "0.18.0"

# Keep debug builds responsive while painting.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
# Pixel loops read more clearly with chunks_exact(4).
chunks_exact_to_as_chunks = "allow"
too_many_arguments = "allow"
